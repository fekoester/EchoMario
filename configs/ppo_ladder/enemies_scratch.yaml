project:
  name: enemies_scratch
  seed: 42
  device: cuda
env:
  name: toy_platformer
  randomize: true
  train_seed_mode: random
  eval_seed_start: 10000
  num_eval_seeds: 20
  width: 210
  height: 18
  camera_width: 36
  max_steps: 1300
  render_scale: 24
  observation_mode: full_screen
  include_state_features: true
  action_mode: discrete_basic
  enable_gaps: true
  enable_bridge_platforms: true
  enable_upper_platforms: true
  enable_moving_enemies: true
  enable_coins: true
  enable_question_blocks: true
  enable_items: true
  num_gaps: 8
  num_bridge_gaps: 3
  num_enemies: 8
  num_coins: 32
  num_question_blocks: 6
  num_upper_platforms: 10
  num_mid_platforms: 9
  min_gap_width: 2
  max_gap_width: 3
  min_bridge_gap_width: 5
  max_bridge_gap_width: 8
  min_platform_width: 3
  max_platform_width: 8
  min_spacing: 9
  enemy_speed: 0.03
  stagnation_timeout: 160
  stagnation_epsilon: 0.05
  stagnation_penalty: -25.0
  progress_reward_scale: 1.3
  step_penalty: -0.003
  coin_reward: 0.5
  item_reward: 2.5
  stomp_reward: 4.0
  goal_reward: 100.0
  death_penalty: -30.0
  safe_landing_reward: 0.25
  gap_clear_reward: 4.5
  gap_jump_reward: 0.8
  gap_jump_lookahead: 5.0
  gap_jump_hold_reward: 0.02
  gap_jump_hold_lookahead: 5.0
  enemy_pass_reward: 2.0
  checkpoint_reward: 3.0
  checkpoint_interval: 20
  discrete_actions: true
reservoir:
  type: sparse_esn
  size: 1200
  spectral_radius: 0.96
  leak_rate: 0.35
  input_scale: 0.75
  sparsity: 0.01
  seed: 123
  state_norm: rms
  input_structure: local
  leak_rate_min: 0.05
  leak_rate_max: 1.0
  device: cuda
logging:
  run_dir: runs/ppo/enemies_scratch
agent:
  lr: 0.0001
  entropy_coef: 0.003
  value_coef: 0.5
  clip_eps: 0.15
  max_grad_norm: 0.5
training:
  total_steps: 500000
  num_envs: 8
  rollout_steps: 512
  minibatch_size: 512
  update_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  save_every_steps: 1000000
  eval_every_steps: 20000

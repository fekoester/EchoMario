# Full difficulty (same levels as toy_platformer_continuous.yaml): 16 enemies, wide bridge gaps.
project:
  name: imitation_full
  seed: 42
  device: cpu
env:
  name: toy_platformer
  randomize: true
  train_seed_mode: random
  eval_seed_start: 10000
  num_eval_seeds: 20
  width: 220
  height: 18
  camera_width: 36
  max_steps: 1400
  render_scale: 24
  observation_mode: full_screen
  include_state_features: true
  enable_gaps: true
  enable_bridge_platforms: true
  enable_upper_platforms: true
  enable_moving_enemies: true
  enable_coins: true
  enable_question_blocks: true
  enable_items: true
  num_gaps: 10
  num_bridge_gaps: 4
  num_enemies: 16
  num_coins: 40
  num_question_blocks: 8
  num_upper_platforms: 14
  num_mid_platforms: 12
  min_gap_width: 2
  max_gap_width: 4
  min_bridge_gap_width: 6
  max_bridge_gap_width: 10
  min_platform_width: 3
  max_platform_width: 8
  min_spacing: 8
  enemy_speed: 0.04
  stagnation_timeout: 170
  stagnation_epsilon: 0.05
  stagnation_penalty: -5.0
  action_mode: discrete_basic
reservoir:
  type: sparse_esn
  size: 1200
  spectral_radius: 0.96
  leak_rate: 0.35
  input_scale: 0.75
  sparsity: 0.01
  seed: 123
  state_norm: rms
logging:
  run_dir: runs/imitation_full

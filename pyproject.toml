[project]
name = "echomario"
version = "0.2.0"
description = "Frozen reservoirs vs. trained recurrent networks for PPO control in a procedurally generated platformer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Felix Koester" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "torch>=2.2",
  "gymnasium>=1.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Rendering, videos and plots (record_video.py, plot_run_comparison.py, env.render()).
viz = [
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
]
# Manual play / exploration windows.
play = [
  "pygame>=2.6",
]
all = [
  "echomario[viz,play]",
]
dev = [
  "echomario[viz]",
  "pytest>=8.0",
  "ruff>=0.5",
]
mario = [
  "gym-super-mario-bros"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/fekoester/EchoMario"

[tool.ruff]
line-length = 120
extend-exclude = ["src/echomario.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
